[package]
name = "loader"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "loader"
test = false
doctest = false
bench = false

[features]
nightly = []
system-test = []

[dependencies]
panic-never = { version = "0.1.0", optional = true }
elf = { version = "0.8.0", default-features = false }
supervisor = { path = "../supervisor" }
dtb = { path = "../../libs/dtb" }
tau = { path = "../../libs/tau" }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1.8" }
